continuous-deployment:
    name: 2. CD - Deploy to PythonAnywhere
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Git Pull & Reload Webapp
        run: |
          python - << 'EOF'
          import urllib.request
          import json

          domain = "chandu1.pythonanywhere.com"
          webhook_url = f"https://{domain}/deploy-webhook/?token=TalkAndSolveDeployKey2026"
          
          print(f"--> Triggering deployment & WSGI reload on {domain}...")
          req = urllib.request.Request(webhook_url, headers={'User-Agent': 'GitHub-Actions-CD'})
          with urllib.request.urlopen(req, timeout=45) as resp:
              body = resp.read().decode('utf-8')
              print(body)
              if "Reload triggered" in body or "Already up to date" in body:
                  print("Deployment Successful: Live app updated and reloaded.")
              else:
                  raise Exception(f"Unexpected webhook response: {body}")
          EOF