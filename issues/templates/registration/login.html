<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Talk & Solve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
        <h3 class="fw-bold mb-3 text-center">Citizen Sign In</h3>
        <p class="text-muted text-center small mb-4">Access your filed civic reports and track updates.</p>
        
        <form method="POST">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2 small">Invalid username or password.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
        </form>

        <div class="text-center mt-3 small">
            Don't have an account? <a href="{% url 'register' %}" class="fw-semibold">Sign Up</a>
        </div>
        <div class="text-center mt-2 small">
            <a href="/" class="text-muted">← Back to Dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
