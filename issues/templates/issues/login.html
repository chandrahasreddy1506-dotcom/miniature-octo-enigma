{% extends 'issues/base.html' %}
{% block content %}
<style>
    .auth-form p {
        margin-bottom: 1.25rem;
        display: flex;
        flex-direction: column;
    }
    .auth-form label {
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
        margin-bottom: 0.4rem;
    }
    .auth-form input[type="text"],
    .auth-form input[type="password"] {
        width: 100%;
        padding: 0.7rem 1rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        outline: none;
        background-color: #f8fafc;
        transition: all 0.2s ease-in-out;
    }
    .auth-form input[type="text"]:focus,
    .auth-form input[type="password"]:focus {
        border-color: #4f46e5;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .auth-form .errorlist {
        color: #e11d48;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        list-style: none;
        padding: 0;
    }
</style>

<div class="max-w-md mx-auto bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-200 my-10">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl text-xl mb-3">
            🔐
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Welcome Back</h1>
        <p class="text-slate-500 text-sm mt-1">Log in to your Talk & Solve account</p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        <div class="auth-form">
            {{ form.as_p }}
        </div>
        <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition shadow-sm text-sm cursor-pointer">
            Log In
        </button>
    </form>
    
    <p class="text-center text-sm text-slate-500 mt-6">
        Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
    </p>
</div>
{% endblock %}
